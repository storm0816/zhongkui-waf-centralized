<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>发布中心</title>
  <link href="../component/pear/css/pear.css" rel="stylesheet">
  <style>
    .release-shell{padding:14px}.release-head{display:flex;justify-content:space-between;gap:16px;align-items:center}
    .release-head h2{font-size:18px;color:#101828}.release-head p{color:#667085;margin-top:5px}.head-actions{display:flex;gap:8px}
    .summary-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin:12px 0}
    .summary-card{background:#fff;border:1px solid #eaecf0;border-radius:8px;padding:14px 16px}
    .summary-card .label{color:#667085;font-size:12px}.summary-card .value{font-size:21px;font-weight:600;color:#101828;margin-top:6px}
    .release-note{border-left:4px solid #2f88ff;background:#eff8ff;padding:11px 16px;margin:12px 0;color:#344054}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar .layui-input{width:220px}
    .status{display:inline-block;padding:2px 9px;border-radius:999px;background:#f2f4f7;color:#475467}
    .status.success,.status.ready{background:#ecfdf3;color:#067647}.status.failed,.status.rolled_back{background:#fef3f2;color:#b42318}
    .status.downloading,.status.validating,.status.switching,.status.queued{background:#fffaeb;color:#b54708}
    .status.releasing{background:#eff8ff;color:#175cd3}.status.paused{background:#fff7e6;color:#b54708}.status.complete{background:#ecfdf3;color:#067647}
    .mono{font-family:Consolas,monospace;font-size:12px}.layui-tab-content{padding:14px 0 0}.node-dialog{padding:12px 16px}
    .dialog-summary{color:#667085;margin-bottom:10px}.geo-current{padding:10px 12px;background:#f8fafc;color:#475467;margin-bottom:12px}
    .release-options{display:grid;grid-template-columns:1.2fr 1.4fr 1fr 1fr;gap:12px;padding:12px;margin-top:12px;background:#f8fafc;border:1px solid #eaecf0;border-radius:6px}
    .release-option label{display:block;color:#475467;font-size:12px;margin-bottom:5px}.release-option .layui-input,.release-option select{width:100%;height:36px}
    .gray-toggle{display:flex;align-items:center;gap:8px;height:36px}.option-help{grid-column:1/-1;color:#667085;font-size:12px}
    .plan-summary{display:flex;gap:7px;align-items:center;white-space:nowrap}.plan-summary .failed{color:#b42318}.plan-summary .pending{color:#b54708}.plan-detail{padding:14px 18px}.plan-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px 18px;margin:0 0 14px}.plan-detail-grid dt{font-size:12px;color:#667085}.plan-detail-grid dd{margin:4px 0 0;font-weight:600;color:#101828}.plan-alert{padding:9px 12px;margin:0 0 12px;border-left:3px solid #f79009;background:#fffaeb;color:#7a2e0e}.plan-meta{font-size:12px;color:#667085;margin-bottom:10px}
    @media(max-width:850px){.plan-detail-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:850px){.summary-grid{grid-template-columns:1fr 1fr}.release-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body class="pear-container">
<div class="release-shell">
  <div class="layui-card"><div class="layui-card-body release-head">
    <div><h2>发布中心</h2><p>统一管理程序版本和 GeoIP 数据，Node 主动拉取、校验、切换并回报结果。</p></div>
    <div class="head-actions release-action"><button class="layui-btn" id="create-program"><i class="layui-icon layui-icon-add-1"></i> 创建程序版本</button><button class="layui-btn layui-btn-normal" id="create-geoip"><i class="layui-icon layui-icon-location"></i> 创建 GeoIP 版本</button></div>
  </div></div>
  <div class="summary-grid">
    <div class="summary-card"><div class="label">Master 程序版本</div><div class="value" id="summary-master">-</div></div>
    <div class="summary-card"><div class="label">最新程序版本</div><div class="value" id="summary-program">-</div></div>
    <div class="summary-card"><div class="label">Master GeoIP</div><div class="value mono" id="summary-geoip">-</div></div>
    <div class="summary-card"><div class="label">在线 Node</div><div class="value" id="summary-online">-</div></div>
  </div>
  <div class="release-note">程序版本与 GeoIP 数据独立发布。两类更新都不会覆盖 Node 的 system.json、证书、日志和运行规则。</div>
  <div class="layui-card"><div class="layui-card-body">
    <div class="layui-tab layui-tab-brief">
      <ul class="layui-tab-title"><li class="layui-this">程序版本</li><li>程序发布记录</li><li>GeoIP 数据</li><li>GeoIP 发布记录</li></ul>
      <div class="layui-tab-content">
        <div class="layui-tab-item layui-show"><table id="program-table" lay-filter="program-table"></table></div>
        <div class="layui-tab-item"><div class="toolbar"><input class="layui-input task-keyword" data-kind="program" placeholder="查询版本、Node IP、发布人"><select class="layui-select task-status" data-kind="program" style="width:150px;height:38px"><option value="">全部状态</option><option value="releasing">发布中</option><option value="paused">已暂停</option><option value="complete">已完成</option><option value="failed">失败</option></select><button class="layui-btn layui-btn-primary task-search" data-kind="program">查询</button></div><table id="program-plan-table" lay-filter="program-plan-table"></table></div>
        <div class="layui-tab-item"><div class="geo-current">当前 Master MMDB：<span class="mono" id="geoip-current-detail">-</span></div><table id="geoip-table" lay-filter="geoip-table"></table></div>
        <div class="layui-tab-item"><div class="toolbar"><input class="layui-input task-keyword" data-kind="geoip" placeholder="查询版本、Node IP、发布人"><select class="layui-select task-status" data-kind="geoip" style="width:150px;height:38px"><option value="">全部状态</option><option value="releasing">发布中</option><option value="paused">已暂停</option><option value="complete">已完成</option><option value="failed">失败</option></select><button class="layui-btn layui-btn-primary task-search" data-kind="geoip">查询</button></div><table id="geoip-plan-table" lay-filter="geoip-plan-table"></table></div>
      </div>
    </div>
  </div></div>
</div>
<script type="text/html" id="program-actions"><button class="layui-btn layui-btn-xs release-action" lay-event="deploy">发布</button></script>
<script type="text/html" id="geoip-actions"><button class="layui-btn layui-btn-normal layui-btn-xs release-action" lay-event="deploy">发布</button></script>
<script src="../component/layui/layui.js"></script>
<script>
layui.use(['table','layer','jquery','element'],function(){
  var table=layui.table,layer=layui.layer,$=layui.jquery,canRelease=false,nodes=[],programTasks=[],geoipTasks=[],activePlanDetail=null;
  var names={ready:'可发布',scheduled:'等待调度',waiting_canary:'等待灰度',queued:'等待领取',downloading:'下载中',validating:'校验中',switching:'切换中',success:'成功',failed:'失败',rolled_back:'已回滚',cancelled:'已跳过',idle:'空闲',releasing:'发布中',paused:'已暂停',complete:'已完成'};
  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function badge(v){v=v||'idle';return '<span class="status '+v+'">'+(names[v]||v)+'</span>';}
  function onlineNodes(){return nodes.filter(function(n){return n.node_role!=='master'&&Number(n.is_online)===1;});}
  function loadNodes(cb){$.getJSON('/clusternode/list',{page:1,limit:500},function(res){nodes=res.data||[];$('#summary-online').text(onlineNodes().length);if(cb)cb();});}
  function loadPrograms(){$.getJSON('/programrelease/list',function(res){var rows=res.data||[];$('#summary-master').text(res.current_version||'-');$('#summary-program').text(rows.length?rows[0].version:'尚未创建');table.render({elem:'#program-table',data:rows,page:false,cols:[[
    {field:'version',title:'版本',width:110},{field:'status',title:'状态',width:100,templet:function(d){return badge(d.status);}},{field:'file_count',title:'文件数',width:90},{field:'total_bytes',title:'大小',width:110,templet:function(d){return Math.ceil((Number(d.total_bytes)||0)/1024)+' KB';}},{field:'manifest_checksum',title:'清单 SHA-256',minWidth:250,templet:function(d){return '<span class="mono">'+d.manifest_checksum+'</span>';}},{field:'notes',title:'说明',minWidth:160},{field:'created_by',title:'创建人',width:100},{field:'created_at',title:'创建时间',width:170},{title:'操作',width:90,align:'center',toolbar:canRelease?'#program-actions':null,templet:canRelease?undefined:function(){return '-';}}
  ]]});});}
  function loadGeoip(){$.getJSON('/geoiprelease/list',function(res){var rows=res.data||[],current=res.current||{};$('#summary-geoip').text(current.checksum&&current.checksum!=='unknown'?current.checksum.slice(0,12):current.status||'-');$('#geoip-current-detail').text((current.file||'-')+' / '+(current.checksum||'unknown'));table.render({elem:'#geoip-table',data:rows,page:false,cols:[[
    {field:'version',title:'数据版本',width:190},{field:'status',title:'状态',width:100,templet:function(d){return badge(d.status);}},{field:'file_size',title:'大小',width:120,templet:function(d){return Math.ceil((Number(d.file_size)||0)/1024/1024)+' MB';}},{field:'checksum',title:'MMDB SHA-256',minWidth:250,templet:function(d){return '<span class="mono">'+d.checksum+'</span>';}},{field:'build_time',title:'数据时间',width:170},{field:'notes',title:'说明',minWidth:150},{field:'created_by',title:'创建人',width:100},{field:'created_at',title:'创建时间',width:170},{title:'操作',width:90,align:'center',toolbar:canRelease?'#geoip-actions':null,templet:canRelease?undefined:function(){return '-';}}
  ]]});});}
  function effective(d,kind){var target=kind==='geoip'?d.geoip_update_target:d.program_update_target,nodeStatus=kind==='geoip'?d.geoip_update_status:d.program_update_status;return String(target||'')===String(d.release_version||'')?(nodeStatus||d.status||'idle'):(d.status||'idle');}
  function waitMinutes(d){var value=d.queued_at||d.created_at;if(!value)return 0;var time=new Date(String(value).replace(' ','T')).getTime();return isNaN(time)?0:Math.max(0,Math.floor((Date.now()-time)/60000));}
  function taskMessage(d,kind){var target=kind==='geoip'?d.geoip_update_target:d.program_update_target,nodeMessage=kind==='geoip'?d.geoip_update_message:d.program_update_message,message=String(target||'')===String(d.release_version||'')?(nodeMessage||d.message||'-'):(d.message||'-');if(effective(d,kind)==='queued'){return message+'（已等待 '+waitMinutes(d)+' 分钟，10 分钟后自动暂停）';}return message;}
  function planStatus(rows,kind){var counts={success:0,failed:0,rolled_back:0,cancelled:0,pending:0},hasFailure=false;rows.forEach(function(d){var s=effective(d,kind);if(s==='success')counts.success++;else if(s==='failed'){counts.failed++;hasFailure=true;}else if(s==='rolled_back'){counts.rolled_back++;hasFailure=true;}else if(s==='cancelled')counts.cancelled++;else counts.pending++;});if(hasFailure&&counts.pending>0)return {key:'paused',text:'已暂停',counts:counts};if(counts.pending===0&&counts.failed===0&&counts.rolled_back===0)return {key:'complete',text:'已完成',counts:counts};if(hasFailure)return {key:'failed',text:'发布异常',counts:counts};return {key:'releasing',text:'发布中',counts:counts};}
  function buildPlans(kind){var all=kind==='geoip'?geoipTasks:programTasks,plans={};all.forEach(function(d){var id=d.plan_id||('legacy-'+d.task_id);if(!plans[id])plans[id]={id:id,rows:[]};plans[id].rows.push(d);});return Object.keys(plans).map(function(id){var plan=plans[id],rows=plan.rows,first=rows[0],state=planStatus(rows,kind),latest=rows.reduce(function(a,b){return String(a.updated_at||'')>String(b.updated_at||'')?a:b;}),maxBatch=rows.reduce(function(n,d){return Math.max(n,Number(d.batch_no)||1);},1);return {plan_id:id,release_version:first.release_version,created_by:first.created_by||'-',created_at:first.created_at,updated_at:latest.updated_at,rows:rows,state:state,total:rows.length,has_canary:rows.some(function(d){return Number(d.is_canary)===1;}),max_batch:maxBatch,batch_interval_seconds:first.batch_interval_seconds||60};}).sort(function(a,b){return String(b.created_at||'').localeCompare(String(a.created_at||''));});}
  function planProgress(plan){var c=plan.state.counts,parts=[c.success+' 成功'];if(c.pending)parts.push('<span class="pending">'+c.pending+' 等待</span>');if(c.failed)parts.push('<span class="failed">'+c.failed+' 失败</span>');if(c.rolled_back)parts.push('<span class="failed">'+c.rolled_back+' 回滚</span>');if(c.cancelled)parts.push(c.cancelled+' 跳过');return '<div class="plan-summary">'+parts.join('<span>·</span>')+'</div>';}
  function renderPlans(kind){var key=$.trim($('.task-keyword[data-kind="'+kind+'"]').val()||'').toLowerCase(),filter=$('.task-status[data-kind="'+kind+'"]').val(),rows=buildPlans(kind).filter(function(plan){var haystack=[plan.release_version,plan.created_by,plan.plan_id].concat(plan.rows.map(function(d){return d.node_ip||'';})).join(' ').toLowerCase();return (!key||haystack.indexOf(key)>=0)&&(!filter||plan.state.key===filter);});table.render({elem:'#'+kind+'-plan-table',id:kind+'-plan-table',data:rows,page:true,limit:20,cols:[[
    {field:'release_version',title:'发布版本',width:130,templet:function(d){return '<span class="mono">'+esc(d.release_version)+'</span>';}},{title:'发布方式',width:145,templet:function(d){return d.has_canary?'灰度发布 / '+d.max_batch+' 批':'全量发布';}},{title:'节点进度',width:190,templet:function(d){return d.total+' 台 · '+planProgress(d);}},{title:'总体状态',width:120,templet:function(d){return badge(d.state.key).replace(names[d.state.key]||d.state.key,d.state.text);}},{title:'发布摘要',minWidth:250,templet:function(d){var failed=d.rows.filter(function(row){var s=effective(row,kind);return s==='failed'||s==='rolled_back';})[0];if(failed)return esc(failed.node_ip)+'：'+esc(taskMessage(failed,kind));if(d.state.key==='paused')return '存在失败或回滚节点，后续批次已暂停';if(d.state.key==='complete')return '全部 Node 已完成并上报目标版本';return '批次 '+d.max_batch+'，等待 Node 领取或回报结果';}},{field:'created_by',title:'发布人',width:100},{field:'created_at',title:'创建时间',width:170},{field:'updated_at',title:'最近更新',width:170},{title:'操作',width:88,align:'center',templet:function(){return '<button class="layui-btn layui-btn-xs layui-btn-primary" lay-event="detail">查看</button>';}}
  ]]});}
  function taskActions(d,kind){var status=effective(d,kind);if(!canRelease)return '-';if(status==='failed'||status==='rolled_back')return '<button class="layui-btn layui-btn-xs" lay-event="retry">重新下发</button><button class="layui-btn layui-btn-xs layui-btn-primary" lay-event="skip">跳过</button>';return '-';}
  function runTaskAction(kind,row,action){var label=action==='retry'?'重新下发':'跳过',hint=action==='retry'?'该 Node 将重新领取并执行同一版本任务。':'该 Node 不再参与本次计划，后续批次将继续调度。';layer.confirm('确认'+label+' Node '+esc(row.node_ip)+'？<br><span style="color:#667085">'+hint+'</span>',function(index){$.post(kind==='geoip'?'/geoiprelease/'+action:'/programrelease/'+action,{task_id:row.task_id},function(res){layer.close(index);if(res.code===0){if(activePlanDetail&&activePlanDetail.index!==undefined)layer.close(activePlanDetail.index);activePlanDetail=null;layer.msg(res.msg);loadTasks(kind);}else layer.alert(res.msg||label+'失败');},'json');});}
  function openPlanDetail(kind,plan){var failed=plan.rows.filter(function(d){var s=effective(d,kind);return s==='failed'||s==='rolled_back';}),state=plan.state,summary='<dl class="plan-detail-grid"><div><dt>发布版本</dt><dd class="mono">'+esc(plan.release_version)+'</dd></div><div><dt>发布方式</dt><dd>'+(plan.has_canary?'灰度发布':'全量发布')+'</dd></div><div><dt>节点进度</dt><dd>'+state.counts.success+' / '+plan.total+' 成功</dd></div><div><dt>总体状态</dt><dd>'+badge(state.key).replace(names[state.key]||state.key,state.text)+'</dd></div><div><dt>批次设置</dt><dd>'+plan.max_batch+' 批，间隔 '+esc(plan.batch_interval_seconds)+' 秒</dd></div><div><dt>发布人</dt><dd>'+esc(plan.created_by)+'</dd></div><div><dt>创建时间</dt><dd>'+esc(plan.created_at||'-')+'</dd></div><div><dt>最近更新</dt><dd>'+esc(plan.updated_at||'-')+'</dd></div></dl>',alert=failed.length?'<div class="plan-alert">失败节点：'+failed.map(function(d){return esc(d.node_ip)+'（'+esc(taskMessage(d,kind))+'）';}).join('；')+'</div>':'',content='<div class="plan-detail">'+summary+alert+'<div class="plan-meta">节点任务明细</div><table id="plan-node-detail-table" lay-filter="plan-node-detail-table"></table></div>';layer.open({type:1,title:(kind==='geoip'?'GeoIP':'程序')+' 发布详情 · '+esc(plan.release_version),area:['92%','720px'],maxWidth:1180,content:content,success:function(layero,index){activePlanDetail={kind:kind,plan:plan,index:index};table.render({elem:'#plan-node-detail-table',data:plan.rows,page:false,cols:[[
    {field:'node_ip',title:'Node',width:150},{field:'hostname',title:'主机名',minWidth:150},{title:'批次',width:90,templet:function(d){return Number(d.is_canary)===1?'灰度':('第 '+(d.batch_no||1)+' 批');}},{title:kind==='geoip'?'当前 MMDB':'当前程序',minWidth:160,templet:function(d){return '<span class="mono">'+esc(kind==='geoip'?(d.mmdb_checksum||'unknown'):(d.app_version||'unknown'))+'</span>';}},{field:'last_seen',title:'最后心跳',width:170,templet:function(d){return esc(d.last_seen||'-');}},{title:'任务状态',width:110,templet:function(d){return badge(effective(d,kind));}},{title:'执行信息',minWidth:250,templet:function(d){return esc(taskMessage(d,kind));}},{field:'queued_at',title:'下发时间',width:170},{field:'finished_at',title:'完成时间',width:170},{title:'操作',width:145,templet:function(d){return taskActions(d,kind);}}
  ]]});},end:function(){activePlanDetail=null;}});}
  function loadTasks(kind){$.getJSON(kind==='geoip'?'/geoiprelease/deployments':'/programrelease/deployments',function(res){if(kind==='geoip')geoipTasks=res.data||[];else programTasks=res.data||[];renderPlans(kind);});}
  function releaseOptions(ips){var gray=$('#gray-release').prop('checked')&&ips.length>1,canary=$('#canary-node').val()||ips[0]||'';if(ips.indexOf(canary)<0)canary=ips[0]||'';return{gray_release:gray?'1':'0',canary_ip:canary,batch_size:Math.max(1,Math.min(50,Number($('#batch-size').val())||2)),batch_interval:Math.max(30,Math.min(3600,Number($('#batch-interval').val())||60))};}
  function deploy(kind,version,ips){if(!ips.length)return layer.msg('没有需要更新的在线 Node');var label=kind==='geoip'?'GeoIP 数据':'程序版本',options=releaseOptions(ips),summary=options.gray_release==='1'?('先灰度 '+options.canary_ip+'，通过后每批 '+options.batch_size+' 台，间隔 '+options.batch_interval+' 秒'):('每批 '+options.batch_size+' 台，间隔 '+options.batch_interval+' 秒');layer.confirm('确认将 '+label+' '+version+' 发布到 '+ips.length+' 个 Node？<br><span style="color:#667085">'+esc(summary)+'</span>',function(index){$.post(kind==='geoip'?'/geoiprelease/deploy':'/programrelease/deploy',$.extend({version:version,node_ips:ips.join(',')},options),function(res){layer.close(index);if(res.code===0){layer.closeAll('page');layer.msg(res.msg);loadTasks(kind);}else layer.alert(res.msg||'发布失败');},'json');});}
  function openNodes(kind,row){loadNodes(function(){var targets=onlineNodes().filter(function(n){return kind==='geoip'?n.mmdb_checksum!==row.checksum:n.app_version!==row.version;}),canaryOptions=targets.map(function(n){return '<option value="'+esc(n.ip)+'">'+esc(n.ip)+' / '+esc(n.hostname||'-')+'</option>';}).join('');var content='<div class="node-dialog"><div class="dialog-summary">目标版本：<b>'+esc(row.version)+'</b>，仅列出在线且版本不同的 Node。</div><table id="target-nodes"></table><div class="release-options"><div class="release-option"><label>灰度发布</label><div class="gray-toggle"><input type="checkbox" id="gray-release" checked><span>先验证 1 个 Node</span></div></div><div class="release-option"><label>灰度节点</label><select id="canary-node" class="layui-select">'+canaryOptions+'</select></div><div class="release-option"><label>批次大小（台）</label><input class="layui-input" type="number" id="batch-size" min="1" max="50" value="2"></div><div class="release-option"><label>批次间隔（秒）</label><input class="layui-input" type="number" id="batch-interval" min="30" max="3600" value="60"></div><div class="option-help">灰度失败时自动暂停；后续批次等待上一批结束，再按设置的间隔继续。</div></div><div style="text-align:right;margin-top:12px"><button class="layui-btn" id="deploy-selected">发布所选</button><button class="layui-btn layui-btn-warm" id="deploy-all">发布全部 '+targets.length+' 台</button></div></div>';layer.open({type:1,title:'选择发布 Node',area:['880px','680px'],content:content,success:function(){table.render({id:'target-nodes',elem:'#target-nodes',data:targets,page:false,cols:[[{type:'checkbox',width:48},{field:'ip',title:'Node IP',width:160},{field:'hostname',title:'主机名',minWidth:180},{title:kind==='geoip'?'当前 MMDB':'当前版本',minWidth:180,templet:function(d){return kind==='geoip'?(d.mmdb_checksum||'unknown'):(d.app_version||'unknown');}},{field:'last_seen',title:'最后上报',width:170}]]});$('#gray-release').on('change',function(){$('#canary-node').prop('disabled',!this.checked);});$('#deploy-selected').on('click',function(){deploy(kind,row.version,(table.checkStatus('target-nodes').data||[]).map(function(n){return n.ip;}));});$('#deploy-all').on('click',function(){deploy(kind,row.version,targets.map(function(n){return n.ip;}));});}});});}
  table.on('tool(program-table)',function(o){if(o.event==='deploy')openNodes('program',o.data);});table.on('tool(geoip-table)',function(o){if(o.event==='deploy')openNodes('geoip',o.data);});
  table.on('tool(program-plan-table)',function(o){if(o.event==='detail')openPlanDetail('program',o.data);});table.on('tool(geoip-plan-table)',function(o){if(o.event==='detail')openPlanDetail('geoip',o.data);});
  table.on('tool(plan-node-detail-table)',function(o){if(activePlanDetail&&(o.event==='retry'||o.event==='skip'))runTaskAction(activePlanDetail.kind,o.data,o.event);});
  $('#create-program').on('click',function(){layer.prompt({title:'程序版本说明',formType:2},function(v,i){$.post('/programrelease/create',{notes:v},function(res){layer.close(i);res.code===0?(layer.msg(res.msg),loadPrograms()):layer.alert(res.msg||'创建失败');},'json');});});
  $('#create-geoip').on('click',function(){layer.prompt({title:'GeoIP 数据说明',formType:2},function(v,i){$.post('/geoiprelease/create',{notes:v},function(res){layer.close(i);res.code===0?(layer.msg(res.msg),loadGeoip()):layer.alert(res.msg||'创建失败');},'json');});});
  $('.task-search').on('click',function(){renderPlans($(this).data('kind'));});
  $.getJSON('/user/me',function(res){var p=(res.data&&res.data.permissions)||[];canRelease=p.indexOf('release.manage')>=0;if(!canRelease)$('.release-action').hide();loadPrograms();loadGeoip();});
  loadNodes();loadTasks('program');loadTasks('geoip');setInterval(function(){loadTasks('program');loadTasks('geoip');},15000);
});
</script>
</body>
</html>
