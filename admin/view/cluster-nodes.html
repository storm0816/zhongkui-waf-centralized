<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>在线节点列表</title>
  <link href="../component/pear/css/pear.css" rel="stylesheet">
  <style>
    .offline-row {
      background-color: #ffecec !important;
      color: #c00 !important;
    }
    .stat-icon {
      font-size: 22px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .node-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 20px;
      background: #f2f4f7;
      color: #475467;
    }
    .node-pill.ok {
      background: #ecfdf3;
      color: #067647;
    }
    .node-pill.warn {
      background: #fffaeb;
      color: #b54708;
    }
    .node-pill.err {
      background: #fef3f2;
      color: #b42318;
    }
    .node-pill.master {
      background: #eff8ff;
      color: #175cd3;
    }
    .node-meta {
      line-height: 1.7;
    }
    .node-meta .main {
      color: #101828;
      font-weight: 600;
    }
    .node-meta .sub {
      color: #667085;
      font-size: 12px;
    }
    .state-stack {
      line-height: 1.7;
    }
    .state-stack .main {
      color: #101828;
      font-weight: 600;
    }
    .state-stack .sub {
      color: #667085;
      font-size: 12px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 4px 2px;
    }
    .detail-card {
      border: 1px solid #eaecf0;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
    }
    .detail-card h4 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #344054;
    }
    .layui-table-cell {
      height: auto !important;
      line-height: 1.7 !important;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .layui-table-view .layui-table td {
      padding-top: 2px;
      padding-bottom: 2px;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 6px 0;
      font-size: 13px;
      color: #475467;
    }
    .detail-item strong {
      color: #101828;
      font-weight: 600;
    }
    .release-card {
      border-left: 4px solid #2f88ff;
    }
    .release-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1.5fr) repeat(3, minmax(130px, 1fr));
      gap: 18px;
      align-items: center;
    }
    .release-item .label {
      color: #667085;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .release-item .value {
      color: #101828;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .release-error {
      display: none;
      margin-top: 10px;
      padding: 8px 12px;
      color: #b42318;
      background: #fef3f2;
      border-radius: 4px;
    }
    @media (max-width: 900px) {
      .release-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body class="pear-container">

  <div class="layui-card release-card">
    <div class="layui-card-header">集群规则发布状态</div>
    <div class="layui-card-body">
      <div class="release-grid">
        <div class="release-item">
          <div class="label">当前发布版本</div>
          <div class="value" id="release-version">尚未发布</div>
        </div>
        <div class="release-item">
          <div class="label">发布状态</div>
          <div class="value" id="release-status"><span class="node-pill warn">加载中</span></div>
        </div>
        <div class="release-item">
          <div class="label">发布时间</div>
          <div class="value" id="release-time">-</div>
        </div>
        <div class="release-item">
          <div class="label">发布来源</div>
          <div class="value" id="release-source">-</div>
        </div>
      </div>
      <div class="release-error" id="release-error"></div>
      <div class="release-error" id="restore-status" style="color:#175cd3;background:#eff8ff;"></div>
    </div>
  </div>

  <!-- 统计模块 -->
  <div class="layui-row layui-col-space10">
    <div class="layui-col-md4">
      <div class="layui-card">
        <div class="layui-card-header">
          <i class="layui-icon layui-icon-radio stat-icon"></i> 节点总数
        </div>
        <div class="layui-card-body" id="stat-total">-</div>
      </div>
    </div>
    <div class="layui-col-md4">
      <div class="layui-card">
        <div class="layui-card-header">
          <i class="layui-icon layui-icon-circle-dot stat-icon" style="color: green;"></i> 当前在线
        </div>
        <div class="layui-card-body" id="stat-online">-</div>
      </div>
    </div>
    <div class="layui-col-md4">
      <div class="layui-card">
        <div class="layui-card-header">
          <i class="layui-icon layui-icon-close stat-icon" style="color: red;"></i> 离线节点
        </div>
        <div class="layui-card-body" id="stat-offline">-</div>
      </div>
    </div>
  </div>

  <!-- 控制按钮 -->
  <div class="layui-card-header">
    <div class="layui-btn-group" style="float: right;">
      <button class="layui-btn layui-btn-primary layui-btn-sm" id="btn-show-all">显示全部</button>
      <button class="layui-btn layui-btn-danger layui-btn-sm" id="btn-show-offline">仅离线</button>
      <button class="layui-btn layui-btn-warm layui-btn-sm" id="btn-show-low-version">低版本</button>
    </div>
    在线节点列表
  </div>

  <!-- 表格展示 -->
  <div class="layui-row">
    <div class="layui-col-md12">
      <div class="layui-card">
        <div class="layui-card-body">
          <table id="id-table-nodes" lay-filter="filter-table-nodes"></table>
        </div>
      </div>
    </div>
  </div>

  <script src="../component/layui/layui.js"></script>
  <script src="../component/pear/pear.js"></script>
  <script>
    layui.use(['table', 'jquery', 'layer'], function () {
      var table = layui.table;
      var $ = layui.$;
      var layer = layui.layer;
      var masterRulesVersion = 'unknown';
      var masterWhitelistVersion = 'unknown';
      var masterBlacklistVersion = 'unknown';
      var masterAppVersion = 'unknown';

      function timeAgo(ts) {
        if (!ts) return '-';
        var d = new Date(String(ts).replace(/-/g, '/'));
        if (isNaN(d.getTime())) return '-';
        var diff = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
        if (diff < 60) return diff + '秒前';
        if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
        if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
        return Math.floor(diff / 86400) + '天前';
      }

      function statusClass(status) {
        if (status === 'ok') return 'ok';
        if (status === 'failed') return 'err';
        return 'warn';
      }

      function statusText(status) {
        if (status === 'ok') return '成功';
        if (status === 'failed') return '失败';
        return status || 'unknown';
      }

      function loadReleaseStatus() {
        $.getJSON('/clusternode/release/status', function (res) {
          if (!res || res.code !== 0) {
            $('#release-status').html('<span class="node-pill err">查询失败</span>');
            $('#release-error').text((res && res.msg) || '无法查询集群发布状态').show();
            return;
          }

          var release = res.data || {};
          if (!release.version) {
            $('#release-version').text('尚未发布');
            $('#release-status').html('<span class="node-pill warn">等待首次发布</span>');
            $('#release-time, #release-source').text('-');
            $('#release-error').hide();
            return;
          }

          $('#release-version').text(release.version);
          $('#release-source').text(release.source || '-');
          $('#release-time').text(release.published_at || release.last_attempt_at || release.created_at || '-');
          if (release.status === 'published') {
            $('#release-status').html('<span class="node-pill ok">已发布</span>');
          } else {
            $('#release-status').html('<span class="node-pill warn">等待发布 / 自动重试</span>');
          }
          if (release.last_error) {
            $('#release-error').text('最近发布错误：' + release.last_error).show();
          } else {
            $('#release-error').hide();
          }
          var restore = release.restore || {};
          if (restore.status === 'conflict_restored') {
            $('#restore-status').text('检测到本地规则版本冲突，已按 MySQL 发布版本恢复。原文件备份：' + (restore.backup_dir || '-')).show();
          } else if (restore.status === 'failed') {
            $('#restore-status').css({color:'#b42318', background:'#fef3f2'})
              .text('本地规则恢复失败：' + (restore.error || '未知错误')).show();
          } else if (restore.status === 'legacy_restored') {
            $('#restore-status').text('已从旧版发布快照恢复白名单/黑名单。').show();
          } else {
            $('#restore-status').hide();
          }
        }).fail(function () {
          $('#release-status').html('<span class="node-pill err">查询失败</span>');
          $('#release-error').text('发布状态接口请求失败').show();
        });
      }

      function syncStateHtml(row) {
        if (row.node_role === 'master') {
          return '<span class="node-pill master">主节点</span>';
        }
        if (row.rules_sync_status === 'failed' || row.whitelist_sync_status === 'failed' || row.blacklist_sync_status === 'failed') {
          return '<span class="node-pill err">同步失败</span>';
        }
        if (row.sync_state === 'ok') {
          return '<span class="node-pill ok">已同步</span>';
        }
        if (row.rules_sync_status !== 'ok' || row.whitelist_sync_status !== 'ok' || row.blacklist_sync_status !== 'ok') {
          return '<span class="node-pill warn">等待同步</span>';
        }
        return '<span class="node-pill warn">待对齐</span>';
      }

      function versionDiffItems(row) {
        var bad = [];
        if (!row.rules_version || row.rules_version === 'unknown'
            || masterRulesVersion === 'unknown' || row.rules_version !== masterRulesVersion) {
          bad.push('规则');
        }
        if (!row.whitelist_version || row.whitelist_version === 'unknown'
            || masterWhitelistVersion === 'unknown' || row.whitelist_version !== masterWhitelistVersion) {
          bad.push('白名单');
        }
        if (!row.blacklist_version || row.blacklist_version === 'unknown'
            || masterBlacklistVersion === 'unknown' || row.blacklist_version !== masterBlacklistVersion) {
          bad.push('黑名单');
        }
        return bad;
      }

      function versionSummaryHtml(row) {
        return '' +
          '<div class="node-meta">' +
            '<div class="main">规则 ' + (row.rules_version || 'unknown') + '</div>' +
            '<div class="sub">白名单 ' + (row.whitelist_version || 'unknown') + ' / 黑名单 ' + (row.blacklist_version || 'unknown') + '</div>' +
          '</div>';
      }

      function versionStateHtml(row) {
        if (row.node_role === 'master') {
          return '<div class="state-stack"><div class="main">基准版本</div><div class="sub">主节点当前版本</div></div>';
        }
        var bad = versionDiffItems(row);

        if (bad.length === 0) {
          return '<div class="state-stack"><div class="main">版本一致</div><div class="sub">已对齐主节点</div></div>';
        }
        return '<div class="state-stack"><div class="main">版本不一致</div><div class="sub">' + bad.join(' / ') + ' 未对齐</div></div>';
      }

      function syncSummaryHtml(row) {
        if (row.node_role === 'master') {
          return '<div class="state-stack"><div class="main">规则 / 白 / 黑</div><div class="sub">主节点本地状态</div></div>';
        }
        var failed = [];
        var pending = [];
        if (row.rules_sync_status === 'failed') failed.push('规则');
        else if (row.rules_sync_status !== 'ok') pending.push('规则');
        if (row.whitelist_sync_status === 'failed') failed.push('白名单');
        else if (row.whitelist_sync_status !== 'ok') pending.push('白名单');
        if (row.blacklist_sync_status === 'failed') failed.push('黑名单');
        else if (row.blacklist_sync_status !== 'ok') pending.push('黑名单');

        if (failed.length > 0) {
          return '<div class="state-stack"><div class="main">同步失败</div><div class="sub">' + failed.join(' / ') + ' 失败</div></div>';
        }
        if (pending.length > 0) {
          return '<div class="state-stack"><div class="main">等待同步</div><div class="sub">' + pending.join(' / ') + ' 未完成</div></div>';
        }
        return '<div class="state-stack"><div class="main">同步正常</div><div class="sub">规则 / 白名单 / 黑名单</div></div>';
      }

      function detailHtml(row) {
        return '' +
          '<div class="detail-grid">' +
            '<div class="detail-card">' +
              '<h4>基础信息</h4>' +
              '<div class="detail-item"><span>节点 IP</span><strong>' + (row.ip || '-') + '</strong></div>' +
              '<div class="detail-item"><span>主机名</span><strong>' + (row.hostname || '-') + '</strong></div>' +
            '<div class="detail-item"><span>角色</span><strong>' + (row.node_role || '-') + '</strong></div>' +
              '<div class="detail-item"><span>程序版本</span><strong>' + (row.app_version || 'unknown') + '</strong></div>' +
              '<div class="detail-item"><span>主控程序版本</span><strong>' + masterAppVersion + '</strong></div>' +
              '<div class="detail-item"><span>最后上报</span><strong>' + (row.last_seen || '-') + '</strong></div>' +
            '</div>' +
            '<div class="detail-card">' +
              '<h4>版本信息</h4>' +
              '<div class="detail-item"><span>规则版本</span><strong>' + (row.rules_version || 'unknown') + '</strong></div>' +
              '<div class="detail-item"><span>白名单版本</span><strong>' + (row.whitelist_version || 'unknown') + '</strong></div>' +
              '<div class="detail-item"><span>黑名单版本</span><strong>' + (row.blacklist_version || 'unknown') + '</strong></div>' +
              '<div class="detail-item"><span>主控规则版本</span><strong>' + masterRulesVersion + '</strong></div>' +
              '<div class="detail-item"><span>主控白名单版本</span><strong>' + masterWhitelistVersion + '</strong></div>' +
              '<div class="detail-item"><span>主控黑名单版本</span><strong>' + masterBlacklistVersion + '</strong></div>' +
            '</div>' +
            '<div class="detail-card">' +
              '<h4>同步状态</h4>' +
              '<div class="detail-item"><span>综合状态</span><strong>' + $('<div>').html(syncStateHtml(row)).text() + '</strong></div>' +
              '<div class="detail-item"><span>最近同步结果</span><strong>' + statusText(row.last_sync_status) + '</strong></div>' +
              '<div class="detail-item"><span>最近同步时间</span><strong>' + (row.last_sync_at || '-') + '</strong></div>' +
            '</div>' +
            '<div class="detail-card">' +
              '<h4>分项同步</h4>' +
              '<div class="detail-item"><span>规则</span><strong>' + statusText(row.rules_sync_status) + ' / ' + (row.rules_sync_at || '-') + '</strong></div>' +
              '<div class="detail-item"><span>白名单</span><strong>' + statusText(row.whitelist_sync_status) + ' / ' + (row.whitelist_sync_at || '-') + '</strong></div>' +
              '<div class="detail-item"><span>黑名单</span><strong>' + statusText(row.blacklist_sync_status) + ' / ' + (row.blacklist_sync_at || '-') + '</strong></div>' +
            '</div>' +
          '</div>';
      }

      var tableIns = table.render({
        id: 'id-table-nodes',
        elem: '#id-table-nodes',
        url: '/clusternode/list',
        cellMinWidth: 88,
        parseData: function (res) {
          masterRulesVersion = res.master_rules_version || 'unknown';
          masterWhitelistVersion = res.master_whitelist_version || 'unknown';
          masterBlacklistVersion = res.master_blacklist_version || 'unknown';
          masterAppVersion = res.master_app_version || 'unknown';
          var rows = res.data || [];
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (row.node_role === 'master') {
              row.sync_state = 'master';
            } else {
              var versionDiffs = versionDiffItems(row);
              var rulesSyncOk = row.rules_sync_status === 'ok';
              var whiteSyncOk = row.whitelist_sync_status === 'ok';
              var blackSyncOk = row.blacklist_sync_status === 'ok';
              row.sync_state = (versionDiffs.length === 0 && rulesSyncOk && whiteSyncOk && blackSyncOk) ? 'ok' : 'lagging';
            }
          }
          return res;
        },
        cols: [[
          {
            field: 'ip',
            title: '节点',
            minWidth: 180,
            templet: function (d) {
              return '' +
                '<div class="node-meta">' +
                  '<div class="main">' + (d.ip || '-') + '</div>' +
                  '<div class="sub">' + (d.hostname || '-') + '</div>' +
                '</div>';
            }
          },
          {
            field: 'node_role',
            title: '角色',
            width: 88,
            templet: function (d) {
              if (d.node_role === 'master') {
                return '<span class="node-pill master">master</span>';
              }
              return '<span class="node-pill">node</span>';
            }
          },
          {
            title: '同步状态',
            width: 108,
            templet: function (d) {
              return syncStateHtml(d);
            }
          },
          {
            field: 'app_version',
            title: '程序版本',
            width: 110,
            templet: function (d) {
              var v = d.app_version || 'unknown';
              if (d.node_role === 'master') {
                return '<span class="node-pill master">' + v + '</span>';
              }
              if (masterAppVersion !== 'unknown' && v === masterAppVersion) {
                return '<span class="node-pill ok">' + v + '</span>';
              }
              return '<span class="node-pill warn">' + v + '</span>';
            }
          },
          {
            title: '版本状态',
            minWidth: 156,
            templet: function (d) {
              return versionStateHtml(d);
            }
          },
          {
            title: '同步摘要',
            minWidth: 156,
            templet: function (d) {
              return syncSummaryHtml(d);
            }
          },
          {
            field: 'last_seen',
            title: '最后上报',
            minWidth: 156,
            templet: function (d) {
              return '' +
                '<div class="state-stack">' +
                  '<div class="main">' + timeAgo(d.last_seen) + '</div>' +
                  '<div class="sub">' + (d.last_seen || '-') + '</div>' +
                '</div>';
            }
          },
          {
            title: '操作',
            align: 'center',
            width: 132,
            templet: function (d) {
              var html = '<button class="layui-btn layui-btn-primary layui-btn-xs btn-detail" data-ip="' + d.ip + '">详情</button>';
              if (Number(d.is_online) === 0 && d.node_role !== 'master') {
                html += ' <button class="layui-btn layui-btn-danger layui-btn-xs btn-del" data-ip="' + d.ip + '">删除</button>';
              }
              return html;
            }
          }
        ]],
        page: true,
        limits: [10, 20, 50, 100],
        limit: 10,
        done: function (res, curr, count) {
          res.data.forEach(function (row, index) {
            if (Number(row.is_online) === 0) {
              $('tr[data-index=' + index + ']').addClass('offline-row');
            }
          });
        }
      });

      $.getJSON("/clusternode/stat", function (res) {
        if (res.code === 0) {
          $("#stat-total").text(res.data.total);
          $("#stat-online").text(res.data.online);
          $("#stat-offline").text(res.data.offline);
        } else {
          console.error("获取统计失败：", res.msg || "未知错误");
        }
      });

      loadReleaseStatus();
      window.setInterval(loadReleaseStatus, 30000);

      $('#btn-show-all').on('click', function () {
        tableIns.reload({ where: {}, page: { curr: 1 } });
      });

      $('#btn-show-offline').on('click', function () {
        tableIns.reload({ where: { offline: 1 }, page: { curr: 1 } });
      });

      $('#btn-show-low-version').on('click', function () {
        tableIns.reload({ where: { low_version: 1 }, page: { curr: 1 } });
      });

      $(document).on('click', '.btn-detail', function () {
        var ip = $(this).data('ip');
        var cache = table.cache['id-table-nodes'] || [];
        var row = null;
        for (var i = 0; i < cache.length; i++) {
          if (cache[i].ip === ip) {
            row = cache[i];
            break;
          }
        }
        if (!row) {
          layer.msg('未找到节点详情');
          return;
        }
        layer.open({
          type: 1,
          title: '节点详情 · ' + ip,
          area: ['760px', '520px'],
          shadeClose: true,
          content: '<div style="padding:16px 18px;background:#f8fafc;min-height:100%;">' + detailHtml(row) + '</div>'
        });
      });

      // 删除按钮事件
      $(document).on('click', '.btn-del', function () {
        var ip = $(this).data('ip');
        layer.confirm('确认删除离线节点 ' + ip + '？', { icon: 3, title: '提示' }, function (index) {
          $.ajax({
            url: '/clusternode/delete',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ ip: ip }),
            success: function (res) {
              if (res.code === 0) {
                layer.msg('删除成功');
                table.reload('id-table-nodes');
                $.getJSON('/clusternode/stat', function (stat) {
                  if (stat.code === 0) {
                    $('#stat-total').text(stat.data.total);
                    $('#stat-online').text(stat.data.online);
                    $('#stat-offline').text(stat.data.offline);
                  }
                });
              } else {
                layer.alert('删除失败：' + (res.msg || '未知错误'), { icon: 2 });
              }
            },
            error: function () {
              layer.alert('请求失败，请稍后重试', { icon: 2 });
            }
          });
          layer.close(index);
        });
      });
    });
  </script>
</body>
</html>
