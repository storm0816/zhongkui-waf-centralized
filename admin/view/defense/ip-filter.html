<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
		<title>IP黑白名单</title>
		<link href="../../component/pear/css/pear.css" rel="stylesheet">
	</head>
	<body class="pear-container">
		<div class="layui-tab layui-tab-brief" lay-filter="filter-ip-scope-tab">
			<ul class="layui-tab-title">
				<li class="layui-this" lay-id="global">全局黑白名单</li>
				<li lay-id="domain">子域名黑白名单</li>
			</ul>
		</div>
		<div class="layui-row layui-col-space10" id="id-global-ip-card">
			<div class="layui-col-md12">
				<div class="layui-card">
					<div class="layui-card-header">IP黑白名单</div>
					<div class="layui-card-body">
						<div class="layui-row layui-form" lay-filter="filter-ip">
							<div class="layui-col-md2">
								<label class="layui-form-label" style="width: auto; padding-left: 0px;">白名单</label>
								<div class="layui-input-block" style="margin-left: 0px;">
									<input type="checkbox" name="whiteIP" lay-skin="switch" id="id-whiteip-state" module-id="whiteIP" lay-filter="filter-ip-module-state" title="ON|OFF" />
								</div>
							</div>
							<div class="layui-col-md2">
								<label class="layui-form-label">黑名单</label>
								<div class="layui-input-block">
									<input type="checkbox" name="blackIP" lay-skin="switch" id="id-blackip-state" module-id="blackIP" lay-filter="filter-ip-module-state" title="ON|OFF" />
								</div>
							</div>
						</div>
						<div class="layui-row layui-col-space10" id="id-div-iplist">
							<div class="layui-col-md12">
								<table id="id-table-iplist" lay-filter="filter-table-iplist"></table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="layui-row layui-col-space10" id="id-domain-policy-card" style="display:none;">
			<div class="layui-col-md12">
				<div class="layui-card">
					<div class="layui-card-header">域名子黑白名单</div>
					<div class="layui-card-body">
						<div class="layui-text" style="margin-bottom:12px;color:#666;">按精确域名独立维护，不需要配置端口、SSL 或源站。子规则追加到全局规则，不覆盖全局名单；地域子黑名单依赖各 Node 已发布且校验一致的 GeoIP 数据。</div>
						<div class="layui-form layui-row layui-col-space10" lay-filter="filter-domain-search" style="margin-bottom:10px;">
							<div class="layui-col-md3"><input class="layui-input" id="id-domain-keyword" placeholder="查询精确域名"></div>
							<div class="layui-col-md2"><select id="id-domain-type"><option value="">全部类型</option><option value="whitelist">子白名单</option><option value="blacklist">子黑名单</option><option value="region">地域子黑名单</option></select></div>
							<div class="layui-col-md2"><select id="id-domain-state"><option value="">全部状态</option><option value="on">启用</option><option value="off">停用</option></select></div>
							<div class="layui-col-md5"><button type="button" class="pear-btn pear-btn-primary" id="id-domain-search">查询</button> <button type="button" class="pear-btn" id="id-domain-reset">重置</button> <button type="button" class="pear-btn pear-btn-primary" id="id-domain-add">+ 新增子规则</button></div>
						</div>
						<table id="id-table-domain-policy" lay-filter="filter-table-domain-policy"></table>
					</div>
				</div>
			</div>
		</div>
		<div class="layui-row layui-col-space10 layui-form" id="id-global-geoip-card" lay-filter="filter-form-geoip">
			<div class="layui-col-md12">
				<div class="layui-card">
					<div class="layui-card-header" id="id-geoip-title">地域级IP黑名单</div>
					<div class="layui-card-body">
						<div class="layui-row layui-col-space10">
							<div class="layui-col-md12" id="id-tab-geoip"></div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<form class="layui-form" style="background-color:#fff;padding: 10px 15px;display: none;" lay-filter="filter-form-iplist" id="id-form-iplist">
			<input type="hidden" name="id" />
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<div class="layui-text" style="margin-bottom:10px;color:#666;">每行填写一个 IP 或 CIDR 网段，可选填写注释。保存时将按“IP + 空格 + 注释”兼容写入原有名单文件。</div>
					<table class="layui-table" style="margin:0;">
						<thead><tr><th style="width:58px;">序号</th><th style="width:240px;">IP / 网段</th><th>备注</th><th style="width:78px;">操作</th></tr></thead>
						<tbody id="id-iplist-editor-body"></tbody>
					</table>
					<button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="id-iplist-add" style="margin-top:10px;">+ 新增一行</button>
					<div class="layui-form-mid layui-word-aux" style="padding-left:0;float:none;">填写示例：<code>1.2.3.4 办公网</code> 或 <code>10.0.0.0/24 生产网段</code>，一个 IP 和对应备注放在同一行。</div>
				</div>
			</div>
			<div class="layui-row layui-col-space10">
				<div class="layui-col-md12">
					<div style="float: right;">
						<button type="submit" class="pear-btn pear-btn-primary" lay-submit lay-filter="filter-iplist-save">保存</button>
						<button type="button" class="pear-btn" lay-on="cancel">取消</button>
					</div>
				</div>
			</div>
		</form>

		<form class="layui-form" style="background:#fff;padding:18px 24px;display:none;" lay-filter="filter-form-domain-policy" id="id-form-domain-policy">
			<input type="hidden" name="id">
			<div class="layui-form-item"><label class="layui-form-label">精确域名</label><div class="layui-input-block"><input class="layui-input" name="domain" lay-verify="required" maxlength="253" placeholder="例如 api.gw.com.cn，不需要配置端口或源站"></div></div>
			<div class="layui-form-item"><label class="layui-form-label">规则类型</label><div class="layui-input-block"><select name="type" id="id-policy-type" lay-filter="filter-policy-type" lay-verify="required"><option value="whitelist">子白名单</option><option value="blacklist">子黑名单</option><option value="region">地域子黑名单</option></select></div></div>
			<div class="layui-form-item" id="id-policy-ip-row"><label class="layui-form-label">IP / 网段</label><div class="layui-input-block"><input class="layui-input" id="id-policy-ip" placeholder="例如 203.0.113.10 或 203.0.113.0/24"></div></div>
			<div class="layui-form-item" id="id-policy-region-row" style="display:none;"><label class="layui-form-label">国家/地区</label><div class="layui-input-block"><select id="id-policy-region"></select></div></div>
			<div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input class="layui-input" name="comment" maxlength="255" placeholder="可选"></div></div>
			<div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><input type="checkbox" name="state" lay-skin="switch" title="ON|OFF" checked></div></div>
			<div class="layui-form-item"><div class="layui-input-block"><button class="pear-btn pear-btn-primary" lay-submit lay-filter="filter-domain-policy-save">保存并发布</button> <button type="button" class="pear-btn" lay-on="cancel">取消</button></div></div>
		</form>

		<script type="text/html" id="iplist_bar">
			<button class="pear-btn pear-btn-primary pear-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i></button>
		</script>
		<script type="text/html" id="iplist_state">
			<input type="checkbox" name="state" value="{{= d.id }}" lay-skin="switch" lay-filter="iplist_switch_status" title="ON|OFF" {{= d.state == "on" ? "checked" : "" }} />
		</script>
		<script type="text/html" id="domain_policy_bar">
			<button class="pear-btn pear-btn-primary pear-btn-xs" lay-event="edit">编辑</button>
			<button class="pear-btn pear-btn-danger pear-btn-xs" lay-event="remove">删除</button>
		</script>

		<script src="../../component/layui/layui.js"></script>
		<script src="../../component/pear/pear.js"></script>
		<script src="../../js/validator.js"></script>
		
		<script>
			layui.use(['form','table','util','jquery','popup','element'], function() {
				var table = layui.table;
				var form = layui.form;
				var util = layui.util;
				var element = layui.element
				var $ = layui.$;
				var popup = layui.popup;
				var layer = layui.layer;

				var currentTabId;
				var disallowArray;

				function escapeHtml(value) {
					return String(value || '')
						.replace(/&/g, '&amp;')
						.replace(/</g, '&lt;')
						.replace(/>/g, '&gt;')
						.replace(/"/g, '&quot;')
						.replace(/'/g, '&#39;');
				}

				function appendIpListEntry(ip, comment) {
					var index = $('#id-iplist-editor-body tr').length + 1;
					$('#id-iplist-editor-body').append(
						'<tr><td class="iplist-entry-index">' + index + '</td>' +
						'<td><input class="layui-input iplist-entry-ip" value="' + escapeHtml(ip) + '" placeholder="例如 10.0.0.0/24"></td>' +
						'<td><input class="layui-input iplist-entry-comment" value="' + escapeHtml(comment) + '" placeholder="可选，例如 办公网"></td>' +
						'<td><button type="button" class="pear-btn pear-btn-danger pear-btn-xs iplist-entry-remove">删除</button></td></tr>'
					);
				}

				function renumberIpListEntries() {
					$('#id-iplist-editor-body tr').each(function(index) {
						$(this).find('.iplist-entry-index').text(index + 1);
					});
				}

				function loadIpListEntries(content) {
					$('#id-iplist-editor-body').empty();
					$.each((content || '').split(/\r?\n/), function(_, line) {
						var match = $.trim(line || '').match(/^(\S+)(?:\s+(.+))?$/);
						if (match) appendIpListEntry(match[1], match[2] || '');
					});
					if (!$('#id-iplist-editor-body tr').length) appendIpListEntry('', '');
				}

				function collectIpListContent() {
					var lines = [];
					var invalid = false;
					$('#id-iplist-editor-body tr').each(function() {
						var ip = $.trim($(this).find('.iplist-entry-ip').val() || '');
						var comment = $.trim($(this).find('.iplist-entry-comment').val() || '');
						if (!ip && !comment) return;
						if (!ip || !validator.isIPWithCIDR(ip)) {
							invalid = true;
							return false;
						}
						lines.push(ip + (comment ? ' ' + comment.replace(/[\r\n]+/g, ' ') : ''));
					});
					if (invalid || !lines.length) {
						popup.failure('请至少填写一条有效的 IP 或 CIDR 网段');
						return null;
					}
					return lines.join('\n');
				}

				function togglePolicyValue(kind) {
					$('#id-policy-ip-row').toggle(kind !== 'region');
					$('#id-policy-region-row').toggle(kind === 'region');
				}

				function reloadDomainPolicies() {
					table.reload('id-table-domain-policy', {
						where: {domain: $.trim($('#id-domain-keyword').val() || ''), type: $('#id-domain-type').val(), state: $('#id-domain-state').val()},
						page: {curr: 1}
					});
				}

				function postWithConflictConfirmation(url, field, onSuccess) {
					$.post(url, field, function(res) {
						if (res && res.code == 200) {
							onSuccess(res);
							return;
						}
						if (res && res.code == 409 && res.data && res.data.canForce && !field.force) {
							layer.confirm(escapeHtml(res.msg || '检测到重叠规则，是否继续保存？'), {
								title: '规则重叠提示',
								btn: ['仍然保存', '取消']
							}, function(index) {
								layer.close(index);
								var confirmed = $.extend({}, field, {force: '1'});
								postWithConflictConfirmation(url, confirmed, onSuccess);
							});
							return;
						}
						popup.failure((res && res.msg) || '保存失败');
					}, 'json');
				}

				function openDomainPolicy(row) {
					row = row || {type:'whitelist', state:'on'};
					form.val('filter-form-domain-policy', {id:row.id || '', domain:row.domain || '', type:row.type || 'whitelist', comment:row.comment || '', state:(row.state || 'on') === 'on'});
					$('#id-policy-ip').val(row.type === 'region' ? '' : (row.value || ''));
					$('#id-policy-region').val(row.type === 'region' ? (row.value || '') : '');
					togglePolicyValue(row.type || 'whitelist');
					form.render(null, 'filter-form-domain-policy');
					layer.open({type:1,title:(row.id ? '编辑' : '新增') + '域名子规则',area:['680px','520px'],content:$('#id-form-domain-policy'),end:function(){$('#id-form-domain-policy').trigger('reset');}});
				}

				function getSiteConfig() {
					$.get('/ip/filter/config/get', {siteId : 0}, function(res) {
						if (res && res.data) {
							config = JSON.parse(res.data);

							$('#id-whiteip-state').prop('checked', config.whiteIP.state == 'on' ? true : false);
							$('#id-blackip-state').prop('checked', config.blackIP.state == 'on' ? true : false);

							$(":checkbox[name='geoip_disallow_country']").prop('checked', false);
							var disallowCountrys = config.disallowCountrys;
							if (Array.isArray(disallowCountrys)) {
								$.each(disallowCountrys, function(idx, val) {
									$(":checkbox[name='geoip_disallow_country'][value='" + val + "']").prop('checked', true);
								});
							}

							form.render('checkbox', 'filter-form-geoip');
							form.render(null, 'filter-ip');
						}
					}, "json");
				}

				function initCountries() {
					// 加载国家和地区
					$.get('/admin/data/countries.json', function(res) {
							if (res) {
								var html = '<div class="layui-tab layui-tab-brief" lay-filter="filter-tab-geoip"><ul class="layui-tab-title">';
								html += '<input type="checkbox" id="chooseAll" lay-filter="chooseAll" title="全选">';
								var lis = '';
								var items = '';
								$.each(res, function(key, value) {
									lis +='<li lay-id="' + key + '" style="min-width: 50px;">'+ key + '</li>';
									items += '<div class="layui-tab-item" id="item' + key + '">';

									$.each(value, function(idx, v) {
										if (idx == 0) {
											items += '<div class="layui-row layui-col-space10">';
										} else if (idx % 4 == 0) {
											items += '</div><div class="layui-row layui-col-space10">';
										}
										items += '<div class="layui-col-md3">';
										items += '<input type="checkbox" name="geoip_disallow_country" value="' + v.iso_code + '" title="' + v.name_cn + '" />';
										$('#id-policy-region').append('<option value="' + escapeHtml(v.iso_code) + '">' + escapeHtml(v.name_cn) + ' (' + escapeHtml(v.iso_code) + ')</option>');
										items += '</div>';
										if (idx == value.length - 1) {
											var left = 4 - value.length % 4;
											// 如果最后一行不够4个，补齐4列
											if (left > 0 && left < 4) {
												items += '<div class="layui-col-md' + left * 3 + '"></div>';
											}
											items += '</div>';
										}
									});
									items += '</div>';
								});

								html += lis;
								html += '<div style="float: right;display:inline-block;"><button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit lay-filter="filter-geoip-save">保存</button></div>';
								html += '</ul><div class="layui-tab-content">';
								html += items;
								html += '</div></div>';

								$('#id-tab-geoip').html(html);
								form.render('checkbox', 'filter-form-geoip');
								form.render('select', 'filter-form-domain-policy');

								currentTabId = 'A';
								element.render('tab', 'filter-tab-geoip');
								element.tabChange('filter-tab-geoip', currentTabId);
								element.on('tab(filter-tab-geoip)', function(data){
									var id = $(this).attr('lay-id');
									if (currentTabId != id) {
										$("#chooseAll").prop('checked', false);
										form.render('checkbox', 'filter-form-geoip');
									}
									currentTabId = $(this).attr('lay-id');
								});

								// 全选按钮点击事件
								form.on('checkbox(chooseAll)', function(data) {
									var checked = data.elem.checked;
									var countries = $('#item' + currentTabId).find(':checkbox[name="geoip_disallow_country"]');
									if (checked) {
										countries.each(function() {
											$(this).prop('checked', true);
										});
									} else {
										countries.each(function() {
											$(this).prop('checked', false);
										});
									}
									form.render('checkbox', 'filter-form-geoip');
								});

								// 保存地域级IP黑名单设置
								form.on('submit(filter-geoip-save)', function(data) {
									var arr = [];
									$(':checkbox[name="geoip_disallow_country"]:checked').each(function() {
										arr.push($(this).val());
									});

									var param = {siteId: 0, countries: JSON.stringify(arr)}
									$.post('/ip/filter/rule/geo/update', param, function(data) {
										if (data && data.code == 200) {
											popup.success("已保存");
											return true;
										} else {
											popup.failure(data.msg);
											return false;
										}
									}, "json");

									return false;
								});
							}
					}, "json");
				}

				$(function() {
					initCountries();
					getSiteConfig();
					element.render('tab', 'filter-ip-scope-tab');
					element.on('tab(filter-ip-scope-tab)', function() {
						var scope = $(this).attr('lay-id');
						var isDomain = scope === 'domain';
						$('#id-global-ip-card, #id-global-geoip-card').toggle(!isDomain);
						$('#id-domain-policy-card').toggle(isDomain);
						if (isDomain) reloadDomainPolicies();
					});

					// 阻止回车触发表单提交
					$('input').on('keydown', function (e) {
						if (e.keyCode === 13) {
							e.preventDefault();
							return false;
						}
					});
				});

					table.render({
					elem: '#id-table-iplist',
					url: '/ip/filter/rule/list',
					cols: [[ //标题栏
						{title: '类型', templet: function(d) {
							return d.id == 1 ? '白名单' : '黑名单';
						}, width: 100},
						{field: 'content', title: '内容'},
						{fixed: 'right', title:'操作', width: 110, minWidth: 110, toolbar: '#iplist_bar'}
					]],
					skin: 'line'
				});

				table.render({
					id: 'id-table-domain-policy',
					elem: '#id-table-domain-policy',
					url: '/ip/filter/domain/list',
					where: {},
					page: true,
					limit: 20,
					cols: [[
						{field:'domain',title:'精确域名',minWidth:190},
						{field:'type',title:'类型',width:130,templet:function(d){return {whitelist:'子白名单',blacklist:'子黑名单',region:'地域子黑名单'}[d.type] || d.type;}},
						{field:'value',title:'IP / 网段 / 地区',minWidth:180},
						{field:'comment',title:'备注',minWidth:160,templet:function(d){return escapeHtml(d.comment || '');}},
						{field:'state',title:'状态',width:90,templet:function(d){return d.state === 'off' ? '<span style="color:#999">停用</span>' : '<span style="color:#16a34a">启用</span>'; }},
						{fixed:'right',title:'操作',width:130,toolbar:'#domain_policy_bar'}
					]]
				});

				table.on('tool(filter-table-domain-policy)', function(obj) {
					if (obj.event === 'edit') openDomainPolicy(obj.data);
					if (obj.event === 'remove') {
						layer.confirm('确认删除该域名子规则？', function(index) {
							$.post('/ip/filter/domain/remove', {id:obj.data.id}, function(res) {
								layer.close(index);
								if (res && res.code == 200) { popup.success('已删除并发布'); reloadDomainPolicies(); }
								else popup.failure(res.msg || '删除失败');
							}, 'json');
						});
					}
				});

				form.on('select(filter-policy-type)', function(data) { togglePolicyValue(data.value); });
				$('#id-domain-add').on('click', function() {
					openDomainPolicy();
				});
				$('#id-domain-search').on('click', reloadDomainPolicies);
				$('#id-domain-reset').on('click', function() { $('#id-domain-keyword').val(''); $('#id-domain-type').val(''); $('#id-domain-state').val(''); form.render('select', 'filter-domain-search'); reloadDomainPolicies(); });

				form.on('submit(filter-domain-policy-save)', function(data) {
					var field = data.field;
					field.value = field.type === 'region' ? $('#id-policy-region').val() : $.trim($('#id-policy-ip').val() || '');
					field.state = field.state ? 'on' : 'off';
					if (!field.value) { popup.failure(field.type === 'region' ? '请选择国家或地区' : '请填写IP或CIDR网段'); return false; }
					postWithConflictConfirmation('/ip/filter/domain/save', field, function() {
						layer.closeLast('page');
						popup.success('已保存并发布');
						reloadDomainPolicies();
					});
					return false;
				});

				// 触发单元格工具事件
				table.on('tool(filter-table-iplist)', function(obj) {
					var data = obj.data; // 获得当前行数据

					if(obj.event === 'edit') {
						$.get('/ip/filter/rule/get', {id: data.id}, function(res) {
							if (res && res.code == 200) {
								layer.open({
									type: 1,
									title: '编辑IP' + (data.id == 1 ? '白名单' : '黑名单'),
									shade: 0.6,
									shadeClose: true,
									area: ['860px', '620px'],
									content: $('#id-form-iplist'),
									end: function() {
										$("#id-form-iplist").trigger("reset");
										$("#id-form-iplist").find("input[type='hidden']").val("");
										$('#id-iplist-editor-body').empty();
									}
								});

								form.val('filter-form-iplist', res.data);
								loadIpListEntries(res.data.content);
							} else {
								popup.failure(res.msg);
								return false;
							}
						}, "json");
					}
				});

				util.on('lay-on', {
					cancel: function() {
						layer.closeLast('page');
					}
				});

				$('#id-iplist-add').on('click', function() {
					appendIpListEntry('', '');
					$('#id-iplist-editor-body tr:last .iplist-entry-ip').focus();
				});

				$('#id-iplist-editor-body').on('click', '.iplist-entry-remove', function() {
					$(this).closest('tr').remove();
					renumberIpListEntries();
				});

				// ip名单列表提交保存
				form.on('submit(filter-iplist-save)', function(data) {
					var field = data.field;
					var content = collectIpListContent();
					if (content === null) return false;
					postWithConflictConfirmation('/ip/filter/rule/update', {id: field.id, content: content}, function() {
							table.reloadData('id-table-iplist');
							layer.closeLast('page');
							popup.success("已保存");
					});

					return false;
				});

				form.on('switch(filter-ip-module-state)', function(obj) {
					var name = this.name;
					var state = this.checked ? 'on' : 'off';
					var param = {siteId: 0, state : state}
					param[name] = name;
					$.post('/ip/filter/config/state/update', param, function(data) {
						if (data && data.code == 200) {
							return true;
						} else {
							popup.failure(data.msg);
							return false;
						}
					}, "json");
				});
			});
		</script>
	</body>
</html>
