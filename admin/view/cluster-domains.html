<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集群域名</title>
    <link href="../component/pear/css/pear.css" rel="stylesheet">
    <link href="../css/cluster-domain-table.css?v=copy1" rel="stylesheet">
    <style>.query-bar .layui-inline{margin:0 10px 8px 0;}</style>
</head>
<body class="pear-container">
    <div class="layui-card">
        <div class="layui-card-header">集群域名</div>
        <div class="layui-card-body">
            <form class="layui-form query-bar" lay-filter="filter-domain-query">
                <div class="layui-inline"><input name="domain" placeholder="查询域名" class="layui-input" style="width:240px;"></div>
                <div class="layui-inline"><select name="status"><option value="">全部状态</option><option value="default">默认</option><option value="active">活跃</option><option value="inactive">已停用</option></select></div>
                <div class="layui-inline"><select name="sort24h"><option value="">数据库默认顺序</option><option value="asc">24小时访问升序</option><option value="desc">24小时访问降序</option></select></div>
                <div class="layui-inline"><button class="pear-btn pear-btn-primary" lay-submit lay-filter="filter-domain-search">查询</button><button type="button" class="pear-btn" id="btn-domain-reset">重置</button></div>
            </form>
            <table id="id-table-cluster-domains-view" lay-filter="filter-table-cluster-domains-view"></table>
        </div>
    </div>
    <script src="../component/layui/layui.js"></script>
    <script src="../component/pear/pear.js"></script>
    <script src="../js/cluster-domain-table.js?v=copy1"></script>
    <script>
    layui.use(['form','table','jquery'],function(){
        var form=layui.form,table=layui.table,$=layui.$;
        $('<div class="layui-word-aux"></div>').text(ClusterDomainTable.note).insertBefore('#id-table-cluster-domains-view');
        table.render({id:'id-table-cluster-domains-view',elem:'#id-table-cluster-domains-view',url:'/clusternode/domains',page:true,limit:20,limits:[10,20,50,100],cols:[ClusterDomainTable.columns(false)]});
        table.on('tool(filter-table-cluster-domains-view)',function(obj){ClusterDomainTable.handleEvent(obj,layui.layer);});
        form.on('submit(filter-domain-search)',function(data){table.reloadData('id-table-cluster-domains-view',{where:data.field,page:{curr:1}});return false;});
        $('#btn-domain-reset').on('click',function(){form.val('filter-domain-query',{domain:'',status:'',sort24h:''});form.render();table.reloadData('id-table-cluster-domains-view',{where:{domain:'',status:'',sort24h:''},page:{curr:1}});});
    });
    </script>
</body>
</html>
